name: Release

# 规范化发布流程：在 main/master 上打 git tag（形如 v0.1.0）即自动
# 编译引擎 + 前端，产出 NSIS 安装包，并创建 GitHub Release 草稿。
on:
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      - name: Build & package installer
        run: pnpm --filter @xuanyu/desktop dist

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: xuanyu-agent-setup
          path: apps/desktop/release-dist/*.exe
          if-no-files-found: error

  publish:
    needs: build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: xuanyu-agent-setup
          path: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          generate_release_notes: true
          draft: true