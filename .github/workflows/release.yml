name: Release

# 推 v* 标签触发三端（win / mac 双架构 / linux）打包，产物汇总为 Release 草稿。
# 本轮不签名、不公证，故显式关闭证书自动发现。
on:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            arch: x64
            artifact: windows-x64
            files: |
              apps/desktop/release-dist/*.exe
              apps/desktop/release-dist/*.zip
          # macos-latest 是 arm64 运行器，x64 产物由 Electron 侧交叉打包
          - os: macos-latest
            target: aarch64-apple-darwin
            arch: arm64
            artifact: mac-arm64
            files: |
              apps/desktop/release-dist/*.dmg
              apps/desktop/release-dist/*.zip
          - os: macos-latest
            target: x86_64-apple-darwin
            arch: x64
            artifact: mac-x64
            files: |
              apps/desktop/release-dist/*.dmg
              apps/desktop/release-dist/*.zip
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            arch: x64
            artifact: linux-x64
            files: |
              apps/desktop/release-dist/*.AppImage
              apps/desktop/release-dist/*.deb
              apps/desktop/release-dist/*.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.96.1
        with:
          targets: ${{ matrix.target }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      - name: Build & package
        run: pnpm --filter @xuanyu/desktop dist -- --${{ matrix.arch }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          CARGO_BUILD_TARGET: ${{ matrix.target }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.zip
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
            dist/*.tar.gz
          generate_release_notes: true
          draft: true
