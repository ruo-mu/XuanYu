name: Bug 报告
description: 提交一个可复现的问题
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        请填写以下信息，尽量提供可复现步骤。
  - type: input
    id: version
    attributes:
      label: 版本
      description: 使用的 XuanYu Agent 版本 / 构建来源
      placeholder: "0.1.0"
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: 平台
      options:
        - Windows 10
        - Windows 11
        - 其他
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: 复现步骤
      description: 描述触发问题的步骤
      placeholder: |
        1. 打开…
        2. 点击…
        3. 看到…
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望行为
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为
      description: 附加截图 / 日志更有帮助
    validations:
      required: true